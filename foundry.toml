[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

solc_version = "0.8.30"
evm_version = "cancun"

optimizer = true
optimizer_runs = 200

bytecode_hash = "none"
cbor_metadata = false

fs_permissions = [
    { access = "read", path = "./reference" },
    { access = "read-write", path = "./benchmarks" }
]

[profile.ci]
fuzz = { runs = 10000 }
invariant = { runs = 1000, depth = 100 }

[profile.ci.optimizer_details]
yul = true

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[fuzz]
runs = 1000
max_test_rejects = 65536

[invariant]
runs = 256
depth = 50
fail_on_revert = false

[lint]
lint_on_build = true
